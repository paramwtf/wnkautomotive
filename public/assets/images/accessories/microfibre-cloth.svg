<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#F4F4F6"/>
  <!-- Folded plush microfibre detailing cloth -->
  <g transform="translate(100, 75)">
    <!-- Shadow -->
    <path d="M15 145 L185 160 L205 55 L35 40 Z" fill="#000000" opacity="0.12" transform="translate(5, 8)"/>
    
    <!-- Folded cloth base -->
    <path d="M10 135 C 10 135, 100 148, 185 145 C 190 145, 200 140, 200 135 L 205 50 C 205 45, 195 40, 190 40 L 30 35 C 25 35, 10 40, 10 45 Z" fill="#262626"/>

    <!-- Cloth texture shading -->
    <path d="M10 115 C 10 115, 100 128, 185 125 C 190 125, 200 120, 200 115 L 202 75 C 202 70, 195 68, 190 68 L 25 65 C 20 65, 10 70, 10 75 Z" fill="#333333"/>

    <!-- Top fold -->
    <path d="M12 95 C 12 95, 95 105, 180 102 C 185 102, 195 98, 195 93 L 198 52 C 198 48, 190 45, 185 45 L 25 42 C 20 42, 12 46, 12 50 Z" fill="#404040"/>
    
    <!-- Microfiber plush pile pattern -->
    <path d="M25 55 Q 50 52 75 55 T 125 55 T 175 55" stroke="#525252" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M25 75 Q 50 72 75 75 T 125 75 T 175 75" stroke="#525252" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M25 95 Q 50 92 75 95 T 125 95 T 175 95" stroke="#525252" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Subtle WNK studio label tag -->
    <rect x="15" y="110" width="30" height="14" rx="1" fill="#E61919"/>
    <text x="20" y="120" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#FFFFFF">WNK</text>
  </g>
</svg>

