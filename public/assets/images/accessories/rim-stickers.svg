<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#F4F4F6"/>
  <!-- Rim tape graphics: Outer and inner curved reflective strips -->
  <g transform="translate(200, 150)">
    <!-- Shadow -->
    <path d="M-80 -60 A110 110 0 0 1 80 -60" stroke="#000000" stroke-width="18" stroke-linecap="round" opacity="0.08" transform="translate(0, 6)"/>
    <path d="M-80 60 A110 110 0 0 0 80 60" stroke="#000000" stroke-width="18" stroke-linecap="round" opacity="0.08" transform="translate(0, 6)"/>
    
    <!-- Top arc 1 -->
    <path d="M-85 -55 A110 110 0 0 1 85 -55" stroke="#171717" stroke-width="14" stroke-linecap="round"/>
    <path d="M-50 -75 A110 110 0 0 1 50 -75" stroke="#E61919" stroke-width="5" stroke-linecap="round"/>
    <path d="M-75 -60 A110 110 0 0 1 -30 -80" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Bottom arc 2 -->
    <path d="M-85 55 A110 110 0 0 0 85 55" stroke="#171717" stroke-width="14" stroke-linecap="round"/>
    <path d="M-50 75 A110 110 0 0 0 50 75" stroke="#E61919" stroke-width="5" stroke-linecap="round"/>
    <path d="M30 80 A110 110 0 0 0 75 60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

    <!-- Accent hash marks -->
    <line x1="-30" y1="-85" x2="-25" y2="-75" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-15" y1="-88" x2="-10" y2="-78" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="0" y1="-89" x2="0" y2="-79" stroke="#E61919" stroke-width="2"/>
    <line x1="15" y1="-88" x2="10" y2="-78" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="30" y1="-85" x2="25" y2="-75" stroke="#FFFFFF" stroke-width="2"/>
  </g>
</svg>

